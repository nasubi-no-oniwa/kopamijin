<meta property="og:title" content="木っ端みじん">
<meta property="og:description" content="C4をくっつけて、起爆。全部、木っ端みじんにしろ。">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* 解体現場：黒と危険の黄色、起爆の赤 */
:root{
  --ink:#141418;
  --dark:#1b1b1f;
  --dark2:#2a2a31;
  --cream:#fff8e6;
  --yel:#ffd21f;
  --red:#ff2e3a;
  --org:#ff8a1f;
  --disp:"Dela Gothic One","Hiragino Sans","Noto Sans JP",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --stripe:repeating-linear-gradient(-45deg,var(--yel) 0 14px,var(--ink) 14px 28px);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;background:#7cc4f2;color:var(--cream);overflow:hidden;font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none}
html,body{touch-action:none}
button,input,label,.overlay,.card,.rlist,.wgrid{touch-action:pan-x pan-y}/* 2本指の拡大はさせない（スクロールだけ） */
[hidden]{display:none!important}
#app{position:fixed;inset:0}
#c{width:100%;height:100%;display:block;touch-action:none}
button{font-family:var(--body)}
button:focus-visible{outline:3px solid var(--yel);outline-offset:2px}

/* 上の帯 */
#hud{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 10px 0;display:flex;gap:6px;align-items:flex-start;pointer-events:none}
#hud>*{pointer-events:auto}
.chip{background:rgba(20,20,24,.86);color:var(--cream);border-radius:10px;padding:6px 10px;font-weight:900;font-size:13px;border:0;line-height:1.25}
button.chip{cursor:pointer}
#stInfo{flex:1;min-width:0;text-align:center}
#stInfo b{display:block;font-family:var(--disp);font-weight:400;font-size:15px;color:var(--yel);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#stInfo span{font-size:11px;opacity:.9;display:block}
#bar{height:9px;border-radius:5px;background:rgba(255,248,230,.2);overflow:hidden;margin-top:4px}
#barFill{height:100%;width:0;background:linear-gradient(90deg,var(--org),var(--red));transition:width .2s}
#bar.ok #barFill{background:linear-gradient(90deg,var(--yel),#5cff7a)}
#timeBox{text-align:right;min-width:74px}
#timeBox b{display:block;font-family:var(--disp);font-weight:400;font-size:19px;font-variant-numeric:tabular-nums}
#timeBox span{font-size:11px;opacity:.9}

/* 右下：起爆・上下・1つ戻す */
#ctl{position:absolute;right:calc(env(safe-area-inset-right,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;flex-direction:column;align-items:flex-end;gap:10px;pointer-events:none}
#ctl>*{pointer-events:auto}
.ud{display:flex;flex-direction:column;gap:8px}
.ud button,#undo{width:58px;height:50px;border-radius:14px;border:2px solid rgba(255,248,230,.6);background:rgba(20,20,24,.72);color:var(--cream);font:900 20px var(--body);touch-action:none}
.ud button.on{background:var(--yel);color:var(--ink)}
#undo{width:auto;height:auto;padding:8px 12px;font-size:13px}
#undo:disabled{opacity:.35}
#boom{position:relative;width:104px;height:104px;border-radius:50%;border:0;padding:0;background:var(--stripe);box-shadow:0 6px 0 #000,0 10px 26px rgba(0,0,0,.5);touch-action:none;cursor:pointer}
#boom i{position:absolute;inset:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff7a80,var(--red) 55%,#a3000b);box-shadow:inset 0 -6px 0 rgba(0,0,0,.3);display:grid;place-items:center;font:400 18px var(--disp);font-style:normal;color:#fff;text-shadow:0 2px 0 #7a0008;letter-spacing:.05em}
#boom b{position:absolute;right:-4px;top:-4px;min-width:30px;height:30px;border-radius:15px;background:var(--yel);color:var(--ink);font:400 16px var(--disp);display:grid;place-items:center;padding:0 6px;box-shadow:0 2px 0 #000}
#boom:active i{transform:translateY(3px)}
#boom.dis{filter:grayscale(.7) brightness(.8)}
/* 動画 */
#hud2{position:absolute;left:calc(env(safe-area-inset-left,0px) + 10px);top:calc(env(safe-area-inset-top,0px) + 64px);pointer-events:none}
#hud2>*{pointer-events:auto}
#vidBtn{font-size:13px;padding:7px 11px;border:2px solid var(--yel)}
#vidBtn:disabled{opacity:.75;border-color:#ff4040}
#vid{display:block;width:auto;max-width:100%;max-height:42vh;margin:10px auto 0;border-radius:10px;background:#000}
.gold{margin:6px 0 0;text-align:center;font-weight:900;color:#ffd21f;text-shadow:0 0 10px rgba(255,190,40,.9),0 1px 2px #000}
.big-gold{font-size:17px;animation:goldp 1s ease-in-out infinite alternate}
@keyframes goldp{from{transform:scale(1)}to{transform:scale(1.06)}}
/* ぷにコン */
#stick{position:absolute;left:calc(env(safe-area-inset-left,0px) + 18px);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:132px;height:132px;border-radius:50%;border:3px solid rgba(255,255,255,.55);background:rgba(20,20,24,.38);touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
#stick::before{content:'';position:absolute;inset:-14px;border-radius:50%}
#stick.on{border-color:var(--yel);background:rgba(20,20,24,.5)}
#stick i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,210,31,.85);box-shadow:0 0 14px rgba(255,210,31,.7);pointer-events:none}
#stick span{position:absolute;left:0;right:0;top:-22px;text-align:center;font-size:11px;font-weight:900;color:#fff;text-shadow:0 1px 3px #000;pointer-events:none}

/* まん中の大きい文字 */
#msg{position:absolute;left:0;right:0;top:30%;text-align:center;pointer-events:none;padding:0 12px}
#msgBig{white-space:nowrap;font-family:var(--disp);font-size:clamp(34px,11vw,64px);line-height:1.05;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink),0 0 30px rgba(255,60,40,.7)}
#msgBig.good{color:var(--yel)}
#msgBig.bad{color:#cfd6e0}
#msgSub{margin-top:8px;font-weight:900;font-size:15px;color:#fff;text-shadow:0 1px 3px #000,0 0 10px rgba(0,0,0,.7)}
#hint{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 66px);width:max-content;max-width:min(92%,440px);background:rgba(20,20,24,.82);border-radius:12px;padding:6px 12px;text-align:center;font-weight:900;font-size:14px;pointer-events:none;text-wrap:balance;word-break:auto-phrase}
#hint.err{color:#ffc2c2}
#tut{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 110px);width:min(92%,420px);background:var(--yel);color:var(--ink);font-weight:900;font-size:15px;line-height:1.45;padding:10px 14px;border-radius:12px;box-shadow:0 4px 0 #000;pointer-events:none;text-align:center;text-wrap:balance;word-break:auto-phrase}
#flash{position:absolute;inset:0;background:#fff3c8;opacity:0;pointer-events:none}

/* カード */
.overlay{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr);place-items:safe center;background:rgba(10,10,14,.5);padding:calc(env(safe-area-inset-top,0px) + 16px) 14px calc(env(safe-area-inset-bottom,0px) + 16px);overflow-y:auto}
.card{position:relative;width:min(100%,390px);background:var(--dark);border-radius:16px;padding:22px 18px 16px;text-align:center;box-shadow:0 0 0 5px var(--yel),0 0 0 9px var(--ink),0 20px 44px rgba(0,0,0,.45);overflow:hidden}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:var(--stripe)}
.logo{white-space:nowrap;font-family:var(--disp);font-weight:400;font-size:clamp(40px,12.5vw,60px);line-height:1;margin:14px 0 0;color:#fff;letter-spacing:.02em;text-shadow:0 5px 0 #000}
.logo span{color:var(--red);text-shadow:0 5px 0 #000,0 0 22px rgba(255,46,58,.7)}
.ruby{font-weight:900;font-size:12px;letter-spacing:.3em;color:var(--yel);margin:4px 0 0}
.sub{font-weight:900;font-size:15px;margin:10px 0 0}
.card h2{font-family:var(--disp);font-weight:400;font-size:24px;margin:10px 0 0;color:var(--yel);line-height:1.25}
.big{display:block;width:100%;margin-top:12px;font-family:var(--disp);font-weight:400;font-size:clamp(18px,5.6vw,22px);background:var(--red);color:#fff;border:0;border-radius:12px;padding:12px 14px 13px;cursor:pointer;box-shadow:0 4px 0 #7a0008;letter-spacing:.03em;white-space:nowrap}
.big.yel{background:var(--yel);color:var(--ink);box-shadow:0 4px 0 #8a6d00}
.big.alt{background:transparent;color:var(--cream);border:2px solid rgba(255,248,230,.55);box-shadow:none;font-size:16px;padding:9px}
.big.x{background:#000;color:#fff;box-shadow:0 4px 0 #444;font-size:17px}
.big:disabled{opacity:.5}
.row2{display:flex;gap:8px}.row2 .big{flex:1}
.langs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:14px}
.langs button{font:700 13px var(--body);background:transparent;color:var(--cream);border:1.5px solid rgba(255,248,230,.45);border-radius:999px;padding:4px 11px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--cream);color:var(--ink);border-color:var(--cream)}
.note{margin:10px 0 0;font-weight:700;font-size:13px;opacity:.92;min-height:1.2em}
.note.err{color:#ffb3b3;opacity:1}
.stg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.stg button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:0;border-radius:12px;padding:9px 10px;background:var(--dark2);color:var(--cream);cursor:pointer;box-shadow:inset 0 0 0 2px rgba(255,248,230,.12)}
.stg button b{font:400 16px var(--disp);color:#fff}
.stg button small{font-size:11px;font-weight:700;opacity:.85}
.stg button .no{font:400 12px var(--disp);color:var(--yel)}
.stg button.done{box-shadow:inset 0 0 0 2px var(--yel)}
.res-big{white-space:nowrap;font-family:var(--disp);font-size:clamp(30px,10vw,52px);line-height:1.05;margin:10px 0 0;color:var(--yel);text-shadow:0 4px 0 #000}
.stats{display:flex;gap:6px;margin-top:12px}
.stats div{flex:1;background:var(--dark2);border-radius:10px;padding:6px 4px}
.stats span{display:block;font-size:11px;font-weight:700;opacity:.85}
.stats b{display:block;font-family:var(--disp);font-weight:400;font-size:20px;color:var(--yel)}
.field{display:flex;gap:8px;margin-top:12px}
.field input{flex:1;min-width:0;font:700 17px var(--body);padding:10px 12px;border-radius:10px;border:2px solid var(--cream);background:#fffaf0;color:var(--ink);-webkit-user-select:text;user-select:text}
.field button{border:0;border-radius:10px;background:var(--yel);color:var(--ink);font:900 15px var(--body);padding:0 14px;cursor:pointer}
.rlist{list-style:none;margin:12px 0 0;padding:0;max-height:min(46vh,380px);overflow-y:auto;text-align:left;border-top:2px solid rgba(255,248,230,.4)}
.rlist li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 4px;border-bottom:1px solid rgba(255,248,230,.15)}
.rlist li.me{background:rgba(255,210,31,.16)}
.rlist .no{font-family:var(--disp);font-size:16px;text-align:center;color:var(--yel)}
.rlist .nm{font-weight:900;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rlist .sc{text-align:right;font-size:11px;font-weight:700;white-space:nowrap;line-height:1.25}
.rlist .sc b{font-family:var(--disp);font-weight:400;font-size:17px;color:var(--yel)}
.rempty{padding:16px 0;font-weight:700;text-align:center;display:block!important}
.sel{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.sel button{font:900 13px var(--body);border:1.5px solid rgba(255,248,230,.5);background:transparent;color:var(--cream);border-radius:999px;padding:5px 10px;cursor:pointer}
.sel button[aria-pressed="true"]{background:var(--yel);color:var(--ink);border-color:var(--yel)}
.how{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:8px;text-align:left;font-weight:700;font-size:14px}
.how li{display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:start}
.how li b{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;font-size:12px}
#loading{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;color:var(--cream);background:var(--dark)}

/* ===== 作品モード ===== */
.note.ok{color:#9dffa8;opacity:1}
.newb{display:inline-block;margin-left:8px;background:var(--red);color:#fff;font:400 11px var(--disp);border-radius:6px;padding:2px 6px 3px;vertical-align:3px;letter-spacing:.04em}
#goWk{position:relative}
.card.wide{width:min(100%,470px)}
.wkgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.wkb{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px 12px;border-radius:14px;border:0;background:var(--yel);color:var(--ink);cursor:pointer;box-shadow:0 4px 0 #8a6d00}
.wkb:nth-child(2){background:#5ab8ff;box-shadow:0 4px 0 #1d5f96}
.wkb i{display:grid;place-items:center;width:46px;height:46px}
.wkb i svg{width:42px;height:42px}
.wkb b{font:400 17px var(--disp)}
.wkb small{font-size:11px;font-weight:900;opacity:.85;line-height:1.3}
.wgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px;max-height:min(50vh,430px);overflow-y:auto;padding:2px}
@media (max-width:380px){.wgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.wgrid .rempty{grid-column:1/-1}
.wcard{display:flex;flex-direction:column;background:var(--dark2);border-radius:12px;overflow:hidden;border:0;padding:0;color:var(--cream);cursor:pointer;text-align:left;box-shadow:inset 0 0 0 2px rgba(255,248,230,.1)}
.wcard img,.wcard .noimg{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:linear-gradient(#9fd4f5,#d8f0ff)}
.wcard b{font-weight:900;font-size:13px;padding:6px 8px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wcard small{font-size:10px;font-weight:700;opacity:.8;padding:0 8px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wcard:active{transform:scale(.97)}
.wthumb{display:block;width:150px;height:150px;margin:12px auto 0;border-radius:14px;object-fit:cover;box-shadow:0 0 0 3px var(--yel);background:#9fd4f5}
#wiName{word-break:break-all}
.codebox{margin-top:12px;background:var(--cream);color:var(--ink);border-radius:12px;padding:8px 10px 10px}
.codebox span{display:block;font-size:11px;font-weight:900}
.codebox b{display:block;font:400 30px var(--disp);letter-spacing:.12em;-webkit-user-select:text;user-select:text}
.codein{text-transform:uppercase;letter-spacing:.14em;text-align:center;font-family:var(--disp)!important;font-weight:400!important}
.row2.small .big{font-size:14px;padding:7px}
.sub.small{font-size:13px;line-height:1.5}
label.big{cursor:pointer}
label.big.dis{opacity:.5;pointer-events:none}
.pbar{height:12px;border-radius:6px;background:rgba(255,248,230,.18);overflow:hidden;margin-top:12px}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--yel),#5cff7a);transition:width .25s}
.tips{margin:10px 0 0;padding:0 0 0 1.2em;text-align:left;font-size:12px;font-weight:700;opacity:.85;line-height:1.5}
/* 作る画面 */
#edUI,#phUI{position:absolute;inset:0;pointer-events:none}
#edTop,#phTop{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 10px 0;display:flex;gap:6px;align-items:stretch}
#edTop>*,#phTop>*,#edSide,#edBot,#edHelp,#phSheet{pointer-events:auto}
#edInfo,#phInfo{flex:1;min-width:0;text-align:center}
#edInfo b,#phInfo b{display:block;font-family:var(--disp);font-weight:400;font-size:15px;color:var(--yel);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#edInfo span,#phInfo span{display:block;font-size:11px;opacity:.9;font-variant-numeric:tabular-nums}
#edDone{background:var(--red);color:#fff;font-family:var(--disp);font-weight:400;font-size:15px;padding:6px 12px;box-shadow:0 3px 0 #7a0008}
#edDone:disabled{opacity:.45}
#edSide{position:absolute;right:calc(env(safe-area-inset-right,0px) + 10px);top:calc(env(safe-area-inset-top,0px) + 66px);display:flex;flex-direction:column;gap:7px}
.sbtn{width:48px;height:44px;border-radius:12px;border:2px solid rgba(255,248,230,.5);background:rgba(20,20,24,.78);color:var(--cream);display:grid;place-items:center;padding:0;cursor:pointer}
.sbtn svg{width:24px;height:24px}
.sbtn:disabled{opacity:.3}
.sbtn[aria-pressed="true"]{background:#5ab8ff;color:var(--ink);border-color:#5ab8ff}
#edBot{position:absolute;left:0;right:0;bottom:0;padding:22px 8px calc(env(safe-area-inset-bottom,0px) + 10px);background:linear-gradient(rgba(20,20,24,0),rgba(20,20,24,.78) 34%);display:flex;flex-direction:column;gap:8px;align-items:center}
#edTools{display:flex;gap:6px}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;width:68px;padding:7px 0 5px;border-radius:13px;border:2px solid rgba(255,248,230,.35);background:rgba(20,20,24,.86);color:var(--cream);font:900 11px var(--body);cursor:pointer;transition:transform .08s}
.tool svg{width:26px;height:26px}
.tool[aria-pressed="true"]{background:var(--yel);color:var(--ink);border-color:var(--yel);box-shadow:0 3px 0 #8a6d00;transform:translateY(-2px)}
.palrow{display:flex;align-items:center;gap:8px;max-width:100%}
#edCur{flex:0 0 auto;width:42px;height:42px;border-radius:11px;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.5)}
#edCur.tank,.sw.tank{background:repeating-linear-gradient(-45deg,#ff5a1f 0 6px,#b8350c 6px 12px)}
#edPal{display:flex;gap:6px;overflow-x:auto;padding:5px 3px;scrollbar-width:none;-webkit-overflow-scrolling:touch;min-width:0}
#edPal::-webkit-scrollbar{display:none}
.sw{flex:0 0 auto;width:34px;height:34px;border-radius:9px;border:2px solid rgba(0,0,0,.3);cursor:pointer;padding:0;transition:transform .08s}
.sw.tank{color:#fff;font:400 16px var(--disp);text-shadow:0 1px 0 #000}
.sw[aria-pressed="true"]{outline:3px solid #fff;outline-offset:2px;transform:translateY(-3px)}
#edUI.stroking #edBot,#edUI.stroking #edSide{opacity:.35;pointer-events:none}
#edHelp{position:absolute;left:calc(env(safe-area-inset-left,0px) + 10px);top:calc(env(safe-area-inset-top,0px) + 66px);width:min(calc(100% - 82px),330px);background:var(--yel);color:var(--ink);border-radius:14px;padding:10px 12px;box-shadow:0 4px 0 #000;font-weight:900;font-size:13px;line-height:1.6;text-align:left}
#edHelp p{margin:0;display:grid;grid-template-columns:auto 1fr;column-gap:12px}
#edHelp b{color:#7a0008;white-space:nowrap}
body.ed #hint{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 140px)}
